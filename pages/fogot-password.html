<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quên mật khẩu — CraftLink</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" />
  <link rel="stylesheet" href="../css/base/base.css" />
  <link rel="stylesheet" href="../css/components/style.css" />
  <link rel="stylesheet" href="../css/pages/auth.css" />

</head>
<body>
<div class="app-layout">
  <nav class="top-nav" aria-label="Điều hướng chính">
    <div class="top-nav-inner">
      <a href="../index.html" class="nav-logo">CraftLink</a>
      <div class="nav-links">
        <a href="../index.html" class="nav-link">Trang chủ</a>
        <a href="buyer-marketplace.html" class="nav-link">Dạo chợ</a>
        <a href="buyer-orders.html" class="nav-link">Đơn hàng</a>
        <a href="maker-brief-inbox.html" class="nav-link">Gian hàng</a>
      </div>
      <div class="nav-actions">
        <a href="notifications.html" class="btn btn--sm" aria-label="Thông báo">🔔</a>
        <a href="profile.html" class="btn btn--sm"><span class="nav-user">Tài khoản</span></a>
      </div>
    </div>
  </nav>
  <main class="main-content auth-wrap">
    <div class="auth-box">
      <div class="auth-head">
        <a href="../index.html" class="logo">CraftLink</a>
        <h1 class="auth-title">Quên mật khẩu</h1>
        <p class="muted">Nhập email để nhận link đặt lại</p>
      </div>
      <div class="card">
        <form id="fpForm" novalidate>
          <div class="field"><label class="lbl" for="email">Email <span class="req">*</span></label>
            <input class="input" id="email" type="email" placeholder="ban@email.com" autocomplete="email" />
          </div>
          <button class="btn btn--primary btn--block" id="btnSend" type="submit">Gửi link đặt lại</button>
          <p class="auth-back">
            <a href="login.html">← Quay lại đăng nhập</a>
          </p>
        </form>
        <div id="fpDone" hidden class="fp-done">
          <div class="fp-icon">📬</div>
          <h3 class="u-mb8">Kiểm tra hộp thư!</h3>
          <p class="muted u-mb20">Chúng tôi đã gửi link đặt lại mật khẩu đến <strong id="fpMail"></strong></p>
          <a href="login.html" class="btn btn--primary btn--block">Về trang đăng nhập</a>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../js/api.js"></script>
<script src="../js/modules/ui-state.js"></script>
<script src="../js/pages/forgot-password.js"></script>
</body>
</html>
